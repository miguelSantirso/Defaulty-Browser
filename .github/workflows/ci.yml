name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/macos
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build (debug)
        run: swift build

      - name: Test
        run: swift test

      - name: Build and verify app bundle
        run: make verify

      - name: Zip app
        run: ditto -c -k --keepParent build/Defaulty.app Defaulty-macOS.zip

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: Defaulty-macOS
          path: apps/macos/Defaulty-macOS.zip
          if-no-files-found: error

  # Windows CI will be added with the implementation in apps/windows/.
